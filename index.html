     decode gate in src/cards.js flips <html data-art> when it is usable. -->
<link rel="preload" as="image" href="assets/card-art-atlas.avif" fetchpriority="high">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./match.css">
<!-- ui.css is last on purpose: it carries the component layer and the small set
     of overrides for artefacts that live in files the UI layer does not own. -->
<link rel="stylesheet" href="./ui.css">
</head>
<body>
<!-- Defensive: the engine has previously read `process?.env?.CODEX_*` at module
     scope. Optional chaining does not save an *undeclared* identifier, so such a
     line throws a ReferenceError in a browser and takes the whole module graph
     down with it. This classic script runs before any module and neutralises it.
     See docs/ui-contract.md § "Assumptions about match-engine.js". -->
<script>window.process = window.process || { env: {} };</script>
<div id="app"></div>
<noscript><p style="padding:24px;font:16px system-ui;color:#F5F5F5">The Collective Codex needs JavaScript: the canon, the deck builder and the match engine all run in your browser.</p></noscript>
<script type="module" src="./app.js"></script>
</body>
