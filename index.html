<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>The Collective Codex</title>
<meta name="description" content="The Collective Codex — 1,134 living cards across twenty-one divisions, with a deterministic three-lane local match.">
<link rel="canonical" href="/">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">

<!-- PF-6: the atlas starts downloading before the module graph resolves; the
     decode gate in src/cards.js flips <html data-art> when it is usable. -->
<link rel="preload" as="image" href="assets/card-art-atlas.avif" fetchpriority="high">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./match.css">
<!-- ui.css is last on purpose: it carries the component layer and the small set
     of overrides for artefacts that live in files the UI layer does not own. -->
<link rel="stylesheet" href="./ui.css">
</head>
<body>
<div id="app"></div>
<!-- The class, rather than a style attribute, is what lets the deployed CSP use
     `style-src 'self'` with no `unsafe-inline`: this was the document's only
     inline style. The rule lives in src/css/03-reset.css. -->
<noscript><p class="noscriptNotice">The Collective Codex needs JavaScript: the canon, the deck builder and the match engine all run in your browser.</p></noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
